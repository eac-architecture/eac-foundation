apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: eac-foundation-checkout
  labels:
    app.kubernetes.io/name: eac-foundation
    app.kubernetes.io/component: continuous-integration
spec:
  description: >-
    Checks out one immutable EAC.Foundation revision into the shared source
    workspace without relying on a remote Tekton catalog Task.
  params:
    - name: git-url
      type: string
      description: HTTPS or Git URL of the source repository.
    - name: git-revision
      type: string
      description: Branch, tag, or commit to fetch.
  workspaces:
    - name: source
      description: Shared workspace that receives the repository checkout.
  results:
    - name: commit-sha
      description: Immutable commit resolved from git-revision.
  stepTemplate:
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
      runAsGroup: 65532
      runAsNonRoot: true
      runAsUser: 65532
  steps:
    - name: checkout
      image: alpine/git:2.49.1
      workingDir: $(workspaces.source.path)
      env:
        - name: HOME
          value: $(workspaces.source.path)/.home
        - name: GIT_URL
          value: $(params.git-url)
        - name: GIT_REVISION
          value: $(params.git-revision)
      script: |
        #!/usr/bin/env sh
        set -eu

        rm -rf repository .home
        mkdir -p repository .home
        cd repository
        git init --initial-branch=main
        git remote add origin "$GIT_URL"
        git fetch --depth=1 origin "$GIT_REVISION"
        git checkout --detach FETCH_HEAD
        git rev-parse HEAD | tr -d '\n' > "$(results.commit-sha.path)"
        printf '[OK] Checked out commit %s\n' "$(git rev-parse --short=12 HEAD)"
