apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: eac-foundation-verify
  labels:
    app.kubernetes.io/name: eac-foundation
    app.kubernetes.io/component: continuous-integration
spec:
  description: Builds EAC.Foundation and executes its automated test suites.
  params:
    - name: configuration
      type: string
      default: Release
      description: .NET build configuration.
  workspaces:
    - name: source
      description: Workspace containing the validated repository.
  results:
    - name: test-status
      description: Build and automated test status.
  stepTemplate:
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
      runAsGroup: 65532
      runAsNonRoot: true
      runAsUser: 65532
  steps:
    - name: verify
      image: mcr.microsoft.com/dotnet/sdk:10.0.201
      workingDir: $(workspaces.source.path)/repository
      env:
        - name: BUILD_CONFIGURATION
          value: $(params.configuration)
        - name: CI
          value: "true"
        - name: DOTNET_CLI_HOME
          value: $(workspaces.source.path)/.home/dotnet
        - name: HOME
          value: $(workspaces.source.path)/.home
        - name: NUGET_PACKAGES
          value: $(workspaces.source.path)/.nuget/packages
        - name: TEST_COLOR
          value: Never
        - name: TEST_OUTPUT
          value: Table
      script: |
        #!/usr/bin/env bash
        set -euo pipefail

        status_file="$(results.test-status.path)"
        if bash ./scripts/ci.sh; then
          printf 'Succeeded' > "$status_file"
        else
          printf 'Failed' > "$status_file"
          exit 1
        fi
