apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: eac-foundation-continuous-integration
  labels:
    app.kubernetes.io/name: eac-foundation
    app.kubernetes.io/component: continuous-integration
spec:
  description: >-
    Executes the portable EAC.Foundation G0-G4 continuous integration path
    without publication or release credentials.
  params:
    - name: git-url
      type: string
      description: HTTPS or Git URL of the EAC.Foundation repository.
    - name: git-revision
      type: string
      default: main
      description: Branch, tag, or immutable commit to verify.
    - name: configuration
      type: string
      default: Release
      description: .NET build configuration.
  workspaces:
    - name: source
      description: Source and dependency-cache workspace for this execution.
  tasks:
    - name: checkout
      taskRef:
        kind: Task
        name: eac-foundation-checkout
      params:
        - name: git-url
          value: $(params.git-url)
        - name: git-revision
          value: $(params.git-revision)
      workspaces:
        - name: source
          workspace: source
    - name: validate
      runAfter:
        - checkout
      taskRef:
        kind: Task
        name: eac-foundation-validate
      workspaces:
        - name: source
          workspace: source
    - name: verify
      runAfter:
        - validate
      taskRef:
        kind: Task
        name: eac-foundation-verify
      params:
        - name: configuration
          value: $(params.configuration)
      workspaces:
        - name: source
          workspace: source
  results:
    - name: commit-sha
      description: Immutable commit verified by the pipeline.
      value: $(tasks.checkout.results.commit-sha)
    - name: validation-status
      description: Scope and governance validation status.
      value: $(tasks.validate.results.validation-status)
    - name: test-status
      description: Build and automated test status.
      value: $(tasks.verify.results.test-status)
